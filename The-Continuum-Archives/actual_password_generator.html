<!DOCTYPE html>

<html lang="en">
    <head>
        <title>The Divine Order</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- <link rel="stylesheet" href="../The-Continuum-Archives/style_password.css" type = "text/css" /> -->
         <!-- Asgear is too simple. He doesn't even need css -->
        <script src="../The-Continuum-Archives/actual_password_generator.js" defer></script>
    </head>
    <body>
        <div>
            <header class="section">
                <h1>Password Generator</h1>
                <p class="subtitle">Please disregard the other password generator.</p>
            </header>
            <section class="section outputBox">
                <fieldset class="lengthPicker">
                    <legend class="field-label">Password length</legend>
                    <div class="options">
                        <input type="radio" name="length" id="len32" value="32" checked>
                        <label for="len32">32</label>

                        <input type="radio" name="length" id="len64" value="64" checked>
                        <label for="len64">64</label>

                        <input type="radio" name="length" id="len128" value="128" checked>
                        <label for="len128">128</label>

                        <input type="radio" name="length" id="len256" value="256" checked>
                        <label for="len256">256</label>
                    </div>
                </fieldset>
            </section>

            <section class="section outputBox">
                <label for="password" class="field-label">Generated Password</label>
                <textarea id="password" rows="1" placeholder="Click Generate..." readonly spellcheck="false"></textarea>
                
                <div class="buttonRow">
                    <button type="button" id="btn">Generate Password</button>
                    <button type="button" id="copyBtn" disabled>Copy</button>
                </div>
                <p id="status" class="status" role="status" aria-live="polite"></p>
                
            </section>
        </div>
    </body>
</html>
