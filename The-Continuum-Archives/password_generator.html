<!DOCTYPE html>

<html lang="en">
    <head>
        <title>The Divine Order</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../The-Continuum-Archives/style_password.css" type = "text/css" />
        <script src="../The-Continuum-Archives/password_generator.js" defer></script>
    </head>
    <body>
        <div class="container">
            <header class="section">
                <h1>Password Generator</h1>
                <p class="subtitle">Variants of this password generators have been distributed, each specialised towards different charactersets and character lengths.</p>
                <p class="subtitle">Some characters may not load correctly, depending on supported fonts.</p>
            </header>
            <section class="section outputBox">
                <fieldset class="lengthPicker">
                    <legend class="field-label">Character Set (Characters in Password)</legend>
                    <select id="layer"></select>
                    <p id="layerInfo" class="layerInfo"></p>
                </fieldset>
                <fieldset class="lengthPicker">
                    <legend class="field-label">Password length</legend>
                    <div class="options">
                        <input type="radio" name="length" id="len32" value="32" checked>
                        <label for="len32">32</label>

                        <input type="radio" name="length" id="len64" value="64" checked>
                        <label for="len64">64</label>

                        <input type="radio" name="length" id="len128" value="128" checked>
                        <label for="len128">128</label>

                        <input type="radio" name="length" id="len256" value="256" checked>
                        <label for="len256">256</label>

                        <input type="radio" name="length" id="len512" value="512" checked>
                        <label for="len512">512</label>

                        <input type="radio" name="length" id="len1024" value="1024" checked>
                        <label for="len1024">1024</label>

                        <input type="radio" name="length" id="len2048" value="2048" checked>
                        <label for="len2048">2048</label>
                    </div>
                </fieldset>
            </section>



            <section class="section outputBox">
                <label for="password" class="field-label">Generated Password</label>
                <textarea id="password" rows="1" placeholder="Click Generate..." readonly spellcheck="false"></textarea>
                
                <div class="buttonRow">
                    <button type="button" id="btn">Generate Password</button>
                    <button type="button" id="copyBtn" disabled>Copy</button>
                </div>
                <p id="status" class="status" role="status" aria-live="polite"></p>
                
            </section>
        </div>
    </body>
</html>
